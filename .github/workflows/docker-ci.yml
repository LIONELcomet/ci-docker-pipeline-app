name: Docker Deployment With Automatic Rollback

on: [push]

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Image Name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/ci-docker-app" >> $GITHUB_ENV

      - name: Build New Docker Image
        run: |
          docker build -t $IMAGE_NAME:${{ github.sha }} .
          docker tag $IMAGE_NAME:${{ github.sha }} $IMAGE_NAME:new

      - name: Check Previous Stable Image
        id: stable
        run: |
          if docker pull $IMAGE_NAME:stable; then
            echo "stable_exists=true" >> $GITHUB_OUTPUT
            echo "Previous stable image found."
          else
            echo "stable_exists=false" >> $GITHUB_OUTPUT
            echo "No previous stable image found."
          fi

      - name: Deploy New Version
        run: |
          docker rm -f ci-docker-app 2>/dev/null || true

          docker run -d \
            --name ci-docker-app \
            -p 3001:3000 \
            $IMAGE_NAME:new

      - name: Wait for Application
        run: |
          echo "Waiting for application to start..."
          sleep 10

      - name: Health Check
        id: health
        run: |
          echo "Running deployment health check..."
          curl --fail --retry 3 --retry-delay 2 http://localhost:3001/health
          echo "Health check PASSED."

      - name: Mark New Version Stable
        if: success()
        run: |
          docker tag $IMAGE_NAME:new $IMAGE_NAME:stable
          docker push $IMAGE_NAME:stable
          echo "New version is now STABLE."

      - name: Rollback Failed Deployment
        if: failure() && steps.stable.outputs.stable_exists == 'true'
        run: |
          echo "======================================"
          echo "DEPLOYMENT FAILED"
          echo "STARTING AUTOMATIC ROLLBACK"
          echo "======================================"

          docker logs ci-docker-app || true

          echo "Removing faulty container..."
          docker rm -f ci-docker-app 2>/dev/null || true

          echo "Starting previous stable image..."

          docker run -d \
            --name ci-docker-app \
            -p 3001:3000 \
            $IMAGE_NAME:stable

          echo "Waiting for rollback container..."
          sleep 10

          echo "Checking rollback health..."

          curl --fail --retry 3 --retry-delay 2 \
            http://localhost:3001/health

          echo "======================================"
          echo "ROLLBACK SUCCESSFUL"
          echo "PREVIOUS STABLE VERSION IS ONLINE"
          echo "======================================"

      - name: Rollback Not Available
        if: failure() && steps.stable.outputs.stable_exists != 'true'
        run: |
          echo "Deployment failed."
          echo "No previous stable version is available."
          echo "Rollback cannot be performed."

          docker logs ci-docker-app || true

          exit 1

      - name: Deployment Logs
        if: always()
        run: |
          echo "========== CONTAINER STATUS =========="
          docker ps -a

          echo "========== CONTAINER LOGS =========="
          docker logs ci-docker-app 2>/dev/null || true

      - name: Final Cleanup
        if: always()
        run: |
          docker rm -f ci-docker-app 2>/dev/null || true