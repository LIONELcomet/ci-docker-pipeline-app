name: AWS EC2 Docker Deployment

on: [push]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/lionelcomet/ci-docker-pipeline-app

jobs:

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t $IMAGE_NAME:${{ github.sha }} \
            -t $IMAGE_NAME:latest \
            .

      - name: Push Docker Image
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest


  deploy:
    name: Deploy to AWS EC2
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Deploy Application
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |

            echo "================================"
            echo "AWS EC2 DEPLOYMENT"
            echo "================================"

            echo "Stopping old container..."

            docker rm -f ci-docker-app 2>/dev/null || true

            echo "Pulling latest image..."

            docker pull ghcr.io/lionelcomet/ci-docker-pipeline-app:latest

            echo "Starting new container..."

            docker run -d \
              --name ci-docker-app \
              -p 80:3000 \
              --restart unless-stopped \
              ghcr.io/lionelcomet/ci-docker-pipeline-app:latest

            echo "Waiting for application..."

            sleep 10

            echo "Container status:"

            docker ps

            echo "================================"
            echo "DEPLOYMENT FINISHED"
            echo "================================"


  verify:
    name: Verify Deployment
    needs: deploy
    runs-on: ubuntu-latest

    steps:

      - name: Health Check
        run: |

          echo "================================"
          echo "HEALTH CHECK"
          echo "================================"

          curl --fail \
            --retry 5 \
            --retry-delay 3 \
            http://${{ secrets.SSH_HOST }}/health

          echo ""
          echo "Health check successful."

          echo "================================"
          echo "DEPLOYMENT VERIFIED"
          echo "================================"